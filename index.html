<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Comic Read</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="dashboard">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light-custom border-bottom sticky-top py-2">
        <div class="container-fluid px-3 px-md-4">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#sidebarOffcanvas">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center fw-bold fs-4 m-0" href="index.html">
                    <span class="badge-brand me-1">Comic</span><span class="text-dark">Read</span>
                </a>
            </div>
            <button class="btn btn-outline-secondary btn-sm px-3 py-1 bg-white shadow-xs" id="btnLogout">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid px-3 px-md-4 py-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-3 col-xl-2">
                <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="sidebarOffcanvas">
                    <div class="offcanvas-header border-bottom">
                        <h5 class="offcanvas-title fw-bold"><span class="badge-brand me-1">Comic</span>Read</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                            data-bs-target="#sidebarOffcanvas"></button>
                    </div>
                    <div class="offcanvas-body p-0">
                        <div class="list-group w-100 sidebar-menu shadow-sm rounded-3 overflow-hidden">
                            <a href="index.html" class="list-group-item list-group-item-action active"><i
                                    class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
                            <a href="genre.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-tags-fill me-2"></i> Genre</a>
                            <a href="koleksi.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-book-half me-2"></i> Koleksi</a>
                            <a href="teman.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-people-fill me-2"></i> Teman</a>
                            <a href="peminjaman.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-arrow-left-right me-2"></i> Peminjaman</a>
                            <a href="laporan.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-file-earmark-bar-graph-fill me-2"></i> Laporan</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Konten Dashboard -->
            <div class="col-lg-9 col-xl-10">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="fw-bold text-dark m-0">Dashboard</h3>
                    <span class="text-muted small d-none d-sm-inline" id="currentDate"></span>
                </div>

                <!-- 4 Stat Cards -->
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="card stat-card h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <p class="text-muted small fw-medium mb-1">Total koleksi</p>
                                        <h3 class="fw-bold mb-0" id="stat-total">0</h3>
                                    </div>
                                    <span class="stat-icon bg-warning-subtle text-warning"><i
                                            class="bi bi-journal-bookmark-fill"></i></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card stat-card h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <p class="text-muted small fw-medium mb-1">Tersedia</p>
                                        <h3 class="fw-bold mb-0 text-success" id="stat-tersedia">0</h3>
                                    </div>
                                    <span class="stat-icon bg-success-subtle text-success"><i
                                            class="bi bi-check-circle-fill"></i></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card stat-card h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <p class="text-muted small fw-medium mb-1">Sedang dipinjam</p>
                                        <h3 class="fw-bold mb-0 text-primary" id="stat-dipinjam">0</h3>
                                    </div>
                                    <span class="stat-icon bg-primary-subtle text-primary"><i
                                            class="bi bi-clock-history"></i></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card stat-card h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <p class="text-muted small fw-medium mb-1">Teman</p>
                                        <h3 class="fw-bold mb-0" id="stat-teman">0</h3>
                                    </div>
                                    <span class="stat-icon bg-secondary-subtle text-secondary"><i
                                            class="bi bi-person-hearts"></i></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabel Sedang Dipinjam -->
                <div class="card border shadow-xs rounded-3 overflow-hidden">
                    <div
                        class="card-header bg-light-custom py-2 px-3 border-bottom d-flex justify-content-between align-items-center">
                        <span class="fw-semibold text-secondary small">Sedang dipinjam</span>
                        <a href="peminjaman.html" class="btn btn-sm btn-warning fw-medium">+ Catat Pinjaman</a>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Koleksi</th>
                                    <th>Teman</th>
                                    <th>Sejak</th>
                                    <th class="text-end pe-3">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="dashboard-loan-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
