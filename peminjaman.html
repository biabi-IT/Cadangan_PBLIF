<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peminjaman - Comic Read</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="peminjaman">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light-custom border-bottom sticky-top py-2">
        <div class="container-fluid px-3 px-md-4">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#sidebarOffcanvas">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center fw-bold fs-4 m-0" href="index.html">
                    <span class="badge-brand me-1">Comic</span><span class="text-dark">Read</span>
                </a>
            </div>
            <button class="btn btn-outline-secondary btn-sm px-3 py-1 bg-white shadow-xs" id="btnLogout">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid px-3 px-md-4 py-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-3 col-xl-2">
                <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="sidebarOffcanvas">
                    <div class="offcanvas-header border-bottom">
                        <h5 class="offcanvas-title fw-bold"><span class="badge-brand me-1">Comic</span>Read</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                            data-bs-target="#sidebarOffcanvas"></button>
                    </div>
                    <div class="offcanvas-body p-0">
                        <div class="list-group w-100 sidebar-menu shadow-sm rounded-3 overflow-hidden">
                            <a href="index.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
                            <a href="genre.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-tags-fill me-2"></i> Genre</a>
                            <a href="koleksi.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-book-half me-2"></i> Koleksi</a>
                            <a href="teman.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-people-fill me-2"></i> Teman</a>
                            <a href="peminjaman.html" class="list-group-item list-group-item-action active"><i
                                    class="bi bi-arrow-left-right me-2"></i> Peminjaman</a>
                            <a href="laporan.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-file-earmark-bar-graph-fill me-2"></i> Laporan</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Konten Peminjaman -->
            <div class="col-lg-9 col-xl-10">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <h3 class="fw-bold text-dark m-0">Transaksi Peminjaman</h3>
                    <button class="btn btn-warning fw-semibold" data-bs-toggle="modal" data-bs-target="#modalPinjam">
                        <i class="bi bi-plus-lg me-1"></i> Peminjaman Baru
                    </button>
                </div>
                <div class="card border shadow-xs rounded-3 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Koleksi</th>
                                    <th>Peminjam (Teman)</th>
                                    <th>Tanggal Pinjam</th>
                                    <th>Status</th>
                                    <th class="text-end pe-3">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="table-peminjaman"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Peminjaman Baru -->
    <div class="modal fade" id="modalPinjam" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="formPinjam">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Catat Peminjaman</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Pilih Koleksi (Hanya yang Tersedia)</label>
                        <select class="form-select" id="inputPinjamKoleksi" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Pilih Teman</label>
                        <select class="form-select" id="inputPinjamTeman" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tanggal Pinjam</label>
                        <input type="date" class="form-control" id="inputPinjamTanggal" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-warning fw-semibold">Proses Pinjam</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
