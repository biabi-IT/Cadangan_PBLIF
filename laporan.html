<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan - Comic Read</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="laporan">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light-custom border-bottom sticky-top py-2">
        <div class="container-fluid px-3 px-md-4">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#sidebarOffcanvas">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center fw-bold fs-4 m-0" href="index.html">
                    <span class="badge-brand me-1">Comic</span><span class="text-dark">Read</span>
                </a>
            </div>
            <button class="btn btn-outline-secondary btn-sm px-3 py-1 bg-white shadow-xs" id="btnLogout">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid px-3 px-md-4 py-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-3 col-xl-2">
                <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="sidebarOffcanvas">
                    <div class="offcanvas-header border-bottom">
                        <h5 class="offcanvas-title fw-bold"><span class="badge-brand me-1">Comic</span>Read</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                            data-bs-target="#sidebarOffcanvas"></button>
                    </div>
                    <div class="offcanvas-body p-0">
                        <div class="list-group w-100 sidebar-menu shadow-sm rounded-3 overflow-hidden">
                            <a href="index.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
                            <a href="genre.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-tags-fill me-2"></i> Genre</a>
                            <a href="koleksi.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-book-half me-2"></i> Koleksi</a>
                            <a href="teman.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-people-fill me-2"></i> Teman</a>
                            <a href="peminjaman.html" class="list-group-item list-group-item-action"><i
                                    class="bi bi-arrow-left-right me-2"></i> Peminjaman</a>
                            <a href="laporan.html" class="list-group-item list-group-item-action active"><i
                                    class="bi bi-file-earmark-bar-graph-fill me-2"></i> Laporan</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Konten Laporan -->
            <div class="col-lg-9 col-xl-10">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <h3 class="fw-bold text-dark m-0">Laporan Koleksi & Sirkulasi</h3>
                    <button class="btn btn-outline-dark btn-sm" onclick="window.print()">
                        <i class="bi bi-printer me-1"></i> Cetak Laporan
                    </button>
                </div>
                <div class="card border shadow-xs rounded-3 p-3 p-md-4">
                    <h5 class="fw-bold mb-3">Ringkasan Data Comic Read</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded border">
                                <small class="text-muted d-block">Total Judul Terdaftar</small>
                                <strong class="fs-4" id="lap-total-buku">0</strong>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded border">
                                <small class="text-muted d-block">Total Riwayat Peminjaman</small>
                                <strong class="fs-4" id="lap-total-transaksi">0</strong>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded border">
                                <small class="text-muted d-block">Peminjaman Aktif</small>
                                <strong class="fs-4 text-warning" id="lap-aktif">0</strong>
                            </div>
                        </div>
                    </div>
                    <h6 class="fw-bold mb-2">Riwayat Seluruh Peminjaman</h6>
                    <div class="table-responsive">
                        <table class="table table-bordered table-sm align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Koleksi</th>
                                    <th>Teman</th>
                                    <th>Tgl Pinjam</th>
                                    <th>Tgl Kembali</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="table-laporan"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
