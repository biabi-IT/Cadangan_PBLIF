<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Comic Read</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="daftar" class="bg-light-custom d-flex align-items-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <!-- Brand Logo -->
                <div class="text-center mb-4">
                    <a href="login.html" class="text-decoration-none d-inline-flex align-items-center fw-bold fs-3">
                        <span class="badge-brand me-1">Comic</span><span class="text-dark">Read</span>
                    </a>
                    <p class="text-muted small mt-2 mb-0">Buat akun baru untuk mulai mencatat koleksi komik</p>
                </div>

                <!-- Card Daftar -->
                <div class="card border shadow-sm rounded-4 p-3 p-md-4 bg-white">
                    <div class="card-body p-0">
                        <h4 class="fw-bold text-dark mb-3">Daftar Akun</h4>

                        <!-- Alert Pesan Error / Sukses -->
                        <div id="authAlert" class="alert d-none py-2 small" role="alert"></div>

                        <form id="formDaftar">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Nama Lengkap</label>
                                <input type="text" class="form-control" id="regNama" placeholder="Contoh: Budi Santoso"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Username</label>
                                <input type="text" class="form-control" id="regUsername"
                                    placeholder="Contoh: budikolektor" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Email</label>
                                <input type="email" class="form-control" id="regEmail" placeholder="nama@email.com"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="regPassword"
                                        placeholder="Minimal 6 karakter" minlength="6" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Konfirmasi Password</label>
                                <input type="password" class="form-control" id="regConfirmPassword"
                                    placeholder="Ulangi password" minlength="6" required>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-xs">
                                Daftar Sekarang
                            </button>
                        </form>

                        <hr class="my-4 text-muted">

                        <p class="text-center small text-muted mb-0">
                            Sudah punya akun?
                            <a href="login.html" class="fw-bold text-dark text-decoration-underline">Login di sini</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
